name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            os: linux
            arch: x86_64
            install: sudo apt-get update && sudo apt-get install --yes musl-tools
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            os: linux
            arch: aarch64
            install: sudo apt-get update && sudo apt-get install --yes musl-tools
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: macos
            arch: x86_64
            install: ":"
          - runner: macos-15
            target: aarch64-apple-darwin
            os: macos
            arch: aarch64
            install: ":"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable && rustup default stable
      - run: rustup target add ${{ matrix.target }}
      - run: ${{ matrix.install }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: target/${{ matrix.target }}/release/crank --validate
      - run: sh scripts/package-release.sh ${{ matrix.os }} ${{ matrix.arch }} target/${{ matrix.target }}/release/crank
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build and test inside FreeBSD 14
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: "14.4"
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo test --all-targets
            cargo build --locked --release
            ./target/release/crank --validate
            sh scripts/package-release.sh freebsd x86_64 target/release/crank
      - uses: actions/upload-artifact@v7
        with:
          name: release-freebsd-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, freebsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check tag matches crate and bootstrap versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          crate_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          bootstrap_version=$(sed -n 's/^CRANK_DEFAULT_VERSION=//p' bootstrap/crank.sh)
          test "$RELEASE_TAG" = "v$crate_version"
          test "$crate_version" = "$bootstrap_version"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete release matrix
        run: |
          for artifact in \
            crank-linux-x86_64 crank-linux-aarch64 \
            crank-macos-x86_64 crank-macos-aarch64 \
            crank-freebsd-x86_64
          do
            test -f "dist/$artifact"
            test -f "dist/$artifact.sha256"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Crank $GITHUB_REF_NAME"
